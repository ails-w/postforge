[project]
name = "postforge"
version = "0.1.0"
description = "Generate LinkedIn posts and project-form fields from a repository's real documentation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ails-w" }]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.16",
]

[project.scripts]
postforge = "postforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires real opencode run or model downloads (local only)",
]
